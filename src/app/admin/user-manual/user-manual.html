<section class="manual-shell">
  <header>
    <h2>User Manual</h2>
    <p>Guide for Administrators and Tournament Managers using the CSUA Sports Management System.</p>
  </header>

  <article class="manual-section pdf-section">
    <div class="pdf-toolbar">
      <h3>User Manual (PDF)</h3>
      <a [href]="pdfUrl" target="_blank" rel="noopener" class="pdf-open-link">Open in new tab</a>

    </div>
    <iframe class="pdf-frame" [src]="pdfViewerUrl" title="CSUA Sports Management System User Manual"></iframe>
  </article>
</section>
