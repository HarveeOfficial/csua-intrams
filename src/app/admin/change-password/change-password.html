<div class="max-w-md">
  <h2 class="text-xl font-semibold mb-1">Change Password</h2>
  <p class="text-sm text-slate-500 mb-4">Update the password you use to log in.</p>

  @if (error()) {
    <div class="mb-4 rounded-lg bg-red-50 text-red-700 text-sm px-3 py-2">{{ error() }}</div>
  }
  @if (success()) {
    <div class="mb-4 rounded-lg bg-emerald-50 text-emerald-700 text-sm px-3 py-2">{{ success() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Current password
      <input
        type="password"
        formControlName="current_password"
        autocomplete="current-password"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      New password
      <input
        type="password"
        formControlName="new_password"
        autocomplete="new-password"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
      />
      <small class="text-xs text-slate-400">At least 8 characters.</small>
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Confirm new password
      <input
        type="password"
        formControlName="confirm_password"
        autocomplete="new-password"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
      />
    </label>
    <div class="mt-2">
      <button
        type="submit"
        [disabled]="saving()"
        class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white px-4 py-2 rounded-lg shadow text-sm font-medium"
      >
        {{ saving() ? 'Updating...' : 'Update password' }}
      </button>
    </div>
  </form>
</div>
