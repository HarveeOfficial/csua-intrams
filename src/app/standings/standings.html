  <section class="modern-card">
    <h1 class="text-3xl font-bold text-center sub-gradient-title">Sports Standing</h1>
    <!-- Points-Based Overall Ranking -->
    <app-points-based-ranking
      [colleges]="colleges()"
      standingType="sports"
    ></app-points-based-ranking>

    <app-medal-standings [colleges]="colleges()" standingType="sports"></app-medal-standings>
  </section>

  <section class="modern-card">
    <h1 class="text-3xl font-bold text-center sub-gradient-title">Socio Standing</h1>
    <app-points-based-ranking
      [colleges]="colleges()"
      standingType="socio"
    ></app-points-based-ranking>
    <app-medal-standings [colleges]="colleges()" standingType="socio"></app-medal-standings>
  </section>
